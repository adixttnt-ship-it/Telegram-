<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adinex Earn — Coming Soon</title>
  <meta name="description" content="Adinex Earn is coming soon. Join now and be the first to know when we launch.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      background:#050509;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    body:before{
      content:"";
      position:fixed;
      width:520px;height:520px;
      background:#7c3cff;
      filter:blur(170px);
      opacity:.25;
      top:-180px;left:-150px;
      border-radius:50%;
    }
    body:after{
      content:"";
      position:fixed;
      width:450px;height:450px;
      background:#00d9ff;
      filter:blur(180px);
      opacity:.16;
      right:-180px;bottom:-170px;
      border-radius:50%;
    }
    .card{
      width:min(92%,720px);
      padding:55px 28px;
      text-align:center;
      border:1px solid rgba(255,255,255,.12);
      border-radius:30px;
      background:rgba(12,12,20,.68);
      backdrop-filter:blur(18px);
      box-shadow:0 25px 80px rgba(0,0,0,.55);
      position:relative;
      z-index:1;
    }
    .logo{
      width:105px;height:105px;
      margin:0 auto 25px;
      border-radius:28px;
      display:flex;align-items:center;justify-content:center;
      font-size:42px;font-weight:900;
      letter-spacing:-3px;
      background:linear-gradient(135deg,#ffffff,#a97cff 48%,#00d9ff);
      color:#08080d;
      box-shadow:0 0 22px rgba(150,90,255,.9),0 0 65px rgba(0,217,255,.35);
      animation:glow 2.4s ease-in-out infinite alternate;
    }
    @keyframes glow{
      from{box-shadow:0 0 18px rgba(150,90,255,.7),0 0 45px rgba(0,217,255,.2)}
      to{box-shadow:0 0 30px rgba(150,90,255,1),0 0 85px rgba(0,217,255,.45)}
    }
    .tag{
      display:inline-block;
      padding:8px 15px;
      border-radius:999px;
      background:rgba(124,60,255,.13);
      border:1px solid rgba(180,140,255,.25);
      color:#cdbbff;
      font-size:13px;
      font-weight:700;
      margin-bottom:18px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    h1{font-size:clamp(42px,9vw,78px);line-height:.95;margin-bottom:18px;letter-spacing:-4px}
    h1 span{
      background:linear-gradient(90deg,#fff,#b78cff,#65eaff);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    p{max-width:570px;margin:0 auto 30px;color:#a9a9b7;font-size:17px;line-height:1.65}
    .timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto 30px}
    .unit{padding:17px 8px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04)}
    .num{display:block;font-size:31px;font-weight:800}
    .label{display:block;margin-top:5px;font-size:10px;color:#888896;text-transform:uppercase;letter-spacing:1.5px}
    .join{
      display:inline-block;
      text-decoration:none;
      color:#07070b;
      background:#fff;
      padding:15px 30px;
      border-radius:14px;
      font-weight:800;
      font-size:16px;
      transition:.2s;
      box-shadow:0 8px 35px rgba(255,255,255,.15);
    }
    .join:hover{transform:translateY(-3px);box-shadow:0 12px 45px rgba(170,120,255,.35)}
    .note{font-size:12px;color:#676773;margin-top:18px}
    @media(max-width:480px){
      .card{padding:42px 18px;border-radius:24px}
      .logo{width:88px;height:88px;font-size:34px;border-radius:24px}
      h1{letter-spacing:-2px}
      p{font-size:15px}
      .num{font-size:24px}
      .unit{padding:14px 4px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">AE</div>
    <div class="tag">Something New Is Coming</div>
    <h1>Adinex <span>Earn</span></h1>
    <p>
      We’re getting everything ready for launch. Join now to stay updated
      and be among the first to access the new experience.
    </p>

    <div class="timer" aria-label="Countdown">
      <div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
      <div class="unit"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
    </div>

    <!-- Replace # with your Telegram/channel/app link -->
    <a class="join" href="#" onclick="joinNow(event)">Join Now →</a>
    <div class="note">Automatic 5-minute countdown • Join before it ends</div>
  </main>

  <script>
    // Change this date/time to your launch date.
    const launchDate = Date.now() + (5 * 60 * 1000);

    function updateTimer(){
      const now = Date.now();
      const distance = Math.max(0, launchDate - now);
      const d = Math.floor(distance / 86400000);
      const h = Math.floor((distance % 86400000) / 3600000);
      const m = Math.floor((distance % 3600000) / 60000);
      const s = Math.floor((distance % 60000) / 1000);

      document.getElementById("days").textContent = String(d).padStart(2,"0");
      document.getElementById("hours").textContent = String(h).padStart(2,"0");
      document.getElementById("minutes").textContent = String(m).padStart(2,"0");
      document.getElementById("seconds").textContent = String(s).padStart(2,"0");
    }

    function joinNow(e){
      e.preventDefault();
      // Replace the URL below with your real Join Now destination.
      window.location.href = "https://t.me/";
    }

    updateTimer();
    setInterval(updateTimer,1000);
  </script>
</body>
</html>
